[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarjour-market-intelligence"
version = "0.1.0"
description = "Jarjour Market Intelligence MVP"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.0,<6.0",
  "django-htmx>=1.17,<2.0",
  "django-ninja>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
  "playwright>=1.45,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-django>=4.8,<5.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["apps/server", "."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["venv", ".venv", "data", "apps/server/market/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["venv", "apps/server/market/migrations"]
